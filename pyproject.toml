[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-first-learning-agent"
version = "0.2.0"
description = "Zouma (走马) — Conversation-Native Adaptive Learning System."
keywords = ["zouma", "conversation-native-learning", "adaptive-learning", "ai-tutor", "realtime-voice"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
    "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/sunruian350-Lysander/audio-first-learning-agent"
Issues = "https://github.com/sunruian350-Lysander/audio-first-learning-agent/issues"

[tool.setuptools.packages.find]
include = ["audio_learning*"]

[tool.setuptools.package-data]
audio_learning = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
